[project]
name = "ontology-base-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.139.0",
    "jieba>=0.42.1",
    "litellm>=1.89.3",
    "mcp>=1.28.1",
    "modelscope>=1.37.1",
    "numpy>=2.4.6",
    "oracledb>=26.0.1",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    # Windows 限定: pywin32 只发 win32/win_amd64/win_arm64 轮子, 不挂 marker
    # 会让 Linux/macOS 连 uv sync 都解析不出来 (CI 同理)。
    # core/mcp_client.py 的 win32 路径注入本身已按 isdir 判断, 非 Windows 自动跳过。
    "pywin32>=312; sys_platform == 'win32'",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.1",
    "sqlglot>=30.15.0",
    "torch>=2.12.0",
    "uvicorn>=0.49.0",
]

# ====== 镜像策略: 不在仓库里写死 index, 走 uv 默认 pypi.org ======
# 原因 (2026-09-24 clone 取证): uv.lock 会锁住解析时的 index URL, 写死清华
#   1. 国外使用者大概率连不上清华, 第一步 uv sync 就挂;
#   2. 清华镜像退化期 (大 wheel 33KB/s / 索引页偶发 403) 国内用户也装不上;
#   3. 用户拿 UV_DEFAULT_INDEX 临时换源会改写 uv.lock, 之后裸跑 uv run 又按
#      pyproject 声明的源重新解析 —— 混用必炸。
# 网络受限想用镜像的使用者: 自行选源, 用 UV_DEFAULT_INDEX env var 覆盖
#   (或写进用户级配置 %APPDATA%\uv\uv.toml, 仓库保持官方源不动)
# 换源装完后 uv.lock 里 URL 会变, 那是本地效果, 别提交即可

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "radon>=6.0.1",
]
